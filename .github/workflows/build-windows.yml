name: Build Windows Release & Installer

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE and Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.283.0

      - name: Setup Node.js & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Compile SPIR-V Compute Shaders
        shell: pwsh
        run: |
          cd crates/sloth-vulkan-sys
          ./build.ps1 -CompileShadersOnly
          cd ../..

      - name: Build Windows C++ Vulkan Shared Library
        shell: pwsh
        run: |
          cd crates/sloth-vulkan-sys
          mkdir -p bin
          cl.exe /O2 /EHsc /std:c++20 /LD src/vk_context.cpp src/vk_buffer.cpp src/vk_pipeline.cpp src/sloth_vulkan_api.cpp /Iinclude /I"$env:VULKAN_SDK/Include" /link /LIBPATH:"$env:VULKAN_SDK/Lib" vulkan-1.lib /OUT:bin/libsloth_vulkan.dll
          cd ../..

      - name: Build Rust Sloth-Server Binary
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p sloth-server

      - name: Stage Artifacts
        shell: pwsh
        run: |
          mkdir -p dist-windows/SlothForge
          cp target/x86_64-pc-windows-msvc/release/sloth-server.exe dist-windows/SlothForge/
          if (Test-Path "crates/sloth-vulkan-sys/bin/libsloth_vulkan.dll") {
            cp crates/sloth-vulkan-sys/bin/libsloth_vulkan.dll dist-windows/SlothForge/
          }
          cp -r frontend/dist dist-windows/SlothForge/frontend-dist
          mkdir -p dist-windows/SlothForge/models
          "Put your .gguf models here." | Out-File -Encoding utf8 dist-windows/SlothForge/models/README.txt
          Compress-Archive -Path dist-windows/SlothForge/* -DestinationPath SlothForge-Windows-x64-Portable.zip

      - name: Build Inno Setup Installer
        uses: Cykooz/action-innosetup@v3
        with:
          inno-file: 'packaging/windows/sloth_forge_setup.iss'
        continue-on-error: true

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlothForge-Windows-x64-Portable
          path: SlothForge-Windows-x64-Portable.zip

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlothForge-Setup-Windows-x64
          path: bin/SlothForge-Setup-Windows-x64.exe
          if-no-files-found: warn
