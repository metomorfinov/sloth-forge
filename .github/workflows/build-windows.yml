name: Build Windows Release & Installer

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE and Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanPath = "C:\VulkanSDK"
          $latestVer = Get-ChildItem -Path $vulkanPath -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($latestVer) {
            echo "VULKAN_SDK=$($latestVer.FullName)" >> $env:GITHUB_ENV
            echo "$($latestVer.FullName)\Bin" >> $env:GITHUB_PATH
          }

      - name: Setup Node.js & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      # Шейдеры и C++-слой Vulkan компилирует build.rs крейта sloth-vulkan-sys и встраивает
      # в sloth-server.exe. SLOTH_VULKAN=native: без Vulkan SDK сборка падает, а не выпускает
      # релиз с CPU-заглушкой (раньше так и происходило: собранная DLL не подключалась).
      - name: Build Rust Sloth-Server Binary
        shell: pwsh
        env:
          SLOTH_VULKAN: native
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p sloth-server

      - name: Stage Artifacts
        shell: pwsh
        run: |
          mkdir -p dist-windows/SlothForge
          cp target/x86_64-pc-windows-msvc/release/sloth-server.exe dist-windows/SlothForge/
          cp -r frontend/dist dist-windows/SlothForge/frontend-dist
          mkdir -p dist-windows/SlothForge/models
          "Put your .gguf models here." | Out-File -Encoding utf8 dist-windows/SlothForge/models/README.txt
          Compress-Archive -Path dist-windows/SlothForge/* -DestinationPath SlothForge-Windows-x64-Portable.zip

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $isccPath)) {
            $isccPath = "ISCC.exe"
          }
          & $isccPath packaging/windows/sloth_forge_setup.iss
        continue-on-error: true

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlothForge-Windows-x64-Portable
          path: SlothForge-Windows-x64-Portable.zip

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlothForge-Setup-Windows-x64
          path: bin/SlothForge-Setup-Windows-x64.exe
          if-no-files-found: warn
