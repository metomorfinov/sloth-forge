[workspace]
resolver = "2"
members = [
    "crates/sloth-vulkan-sys",
    "crates/sloth-core",
    "crates/sloth-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SlothForge Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sloth-vulkan-sys = { path = "crates/sloth-vulkan-sys" }
sloth-core = { path = "crates/sloth-core" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
byteorder = "1.5"
memmap2 = "0.9"
rand = "0.8"
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
futures-util = "0.3"
