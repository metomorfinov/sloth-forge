[package]
name = "sloth-server"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sloth-core = { workspace = true }
sloth-vulkan-sys = { workspace = true }
axum.workspace = true
tokio.workspace = true
tower-http = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
thiserror.workspace = true
anyhow.workspace = true
reqwest = { version = "0.12", features = ["json", "stream"] }
sysinfo = "0.33"
# Постоянное хранилище (треды, сообщения, настройки, история обучения).
# bundled: SQLite собирается вместе с сервером, отдельная установка не нужна (и на Windows)
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tokio-tungstenite = "0.23"
# Временные папки для тестов песочницы путей (уже используется в sloth-core)
tempfile = "3.10"
